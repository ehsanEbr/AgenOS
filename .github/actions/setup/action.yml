name: Set up the workspace
description: Node, pnpm and a deterministic (frozen-lockfile) install. Shared by every job so the install logic exists once.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6 # the version is read from "packageManager" in package.json
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    # --frozen-lockfile: fail instead of silently resolving different versions than the ones that were reviewed.
    - run: pnpm install --frozen-lockfile
      shell: bash
