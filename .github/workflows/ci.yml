name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates .env with random throwaway passwords (the same path developers use locally).
      - name: Prepare environment
        run: pnpm setup:env

      - name: Validate Docker Compose configuration
        run: pnpm infra:config

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Start the real infrastructure from the same compose file developers use.
      - name: Start PostgreSQL and Redis
        run: pnpm infra:up

      - name: Validate Prisma schema and apply migrations
        run: |
          pnpm db:validate
          pnpm db:deploy

      - name: Integration tests (real PostgreSQL + Redis)
        run: pnpm test:integration

      - name: Infrastructure logs (on failure)
        if: failure()
        run: docker compose --env-file .env -f infrastructure/compose/docker-compose.yml logs --no-color --tail=200

      - name: Stop infrastructure
        if: always()
        run: pnpm infra:down
