# AgentOS local environment.
#
#   pnpm setup:env && pnpm infra:up     PostgreSQL + Redis only      (then run the apps on the host with `pnpm dev`)
#   pnpm stack:up                       the FULL stack in containers: postgres, redis, migrate, api, worker, web
#
# The applications are behind the `app` profile, so `infra:up` keeps starting only the infrastructure, exactly as before.
# Run everything through the root scripts: they pass the repository-level .env file.
#
# Credentials come from .env and have no defaults on purpose. Published ports are bound to 127.0.0.1 only, so the services
# are reachable from this machine and nowhere else (a development-only convenience: see docs/architecture/docker-compose.md).
#
# Topology (Docker network "agentos-net"):
#   web (nginx :8080) --/api--> api (:3000) --> postgres (:5432)        <- source of truth
#                                  \--> redis (:6379) <-- worker        <- BullMQ queue transport (never a source of truth)

name: agentos

x-app: &app
  profiles: [app]
  init: true # a real PID 1: forwards SIGTERM, reaps zombies
  networks: [agentos-net]
  # Restart only after a FAILURE (non-zero exit), at most 5 times in a row; a clean exit (0) is never restarted.
  # See docs/architecture/docker-compose.md ("Supervision") for what this does and does not cover.
  restart: on-failure:5

# One build definition for all three images. GIT_REVISION labels the image with the commit it was built from (provenance);
# AGENTOS_IMAGE_TAG lets the system tests use their own tag ("systest") so they never reuse or overwrite a developer's `local` images.
x-build: &build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile
  args:
    GIT_REVISION: ${GIT_REVISION:-unknown}

x-node-env: &node-env
  NODE_ENV: production # JSON logs (the only behavioral difference from development: pretty-printing is off)
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Inside the network the services are reached by service name. The credentials are interpolated from .env by Compose and
  # never written to a file in the image.
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - run "pnpm setup:env"}@redis:6379

services:
  postgres:
    # pgvector image: the specification selects pgvector for semantic search (enabled in a later phase).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run "pnpm setup:env"}
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [agentos-net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run "pnpm setup:env"}
    # AOF + periodic snapshot so a dev restart keeps data. Redis is still a cache / ephemeral-state store,
    # never the source of truth (ADR-004).
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save 60 1 --requirepass "$$REDIS_PASSWORD"
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks: [agentos-net]
    healthcheck:
      # REDISCLI_AUTH keeps the password off the process command line.
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # Provisions the database roles (see infrastructure/postgres/roles.sql), then stays idle and reports healthy. Idempotent, so it is
  # safe on a new volume and on an existing one (it re-applies the passwords from .env on every start, and touches no data). It
  # idles instead of exiting because `docker compose up --wait` treats an exited container as a failure; that also lets
  # `depends_on: service_healthy` order it. The only service besides PostgreSQL itself that holds the superuser password.
  db-roles:
    image: pgvector/pgvector:pg17 # for the psql client only
    restart: 'no'
    networks: [agentos-net]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run "pnpm setup:env"}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is required - run "pnpm setup:env"}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required - run "pnpm setup:env"}
    volumes:
      - ../postgres/roles.sql:/roles.sql:ro
    command:
      - sh
      - -c
      - |
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v dbname="$$POSTGRES_DB" -v migrate_password="$$MIGRATE_PASSWORD" -v app_password="$$APP_PASSWORD" -f /roles.sql || exit 1
        touch /tmp/roles-ready
        trap 'exit 0' TERM INT
        while :; do sleep 3600 & wait $$!; done
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/roles-ready']
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      postgres: { condition: service_healthy }

  # One-shot: applies committed Prisma migrations, then exits 0. The API starts only after it succeeded.
  # It connects as the MIGRATION role (owner of the schemas and tables), never as the superuser and never as the API's role.
  migrate:
    <<: *app
    restart: 'no' # a failed migration must stop the stack and stay visible, never loop
    image: agentos-api:${AGENTOS_IMAGE_TAG:-local}
    build: { <<: *build, target: api }
    command: ['pnpm', '--filter', '@agentos/api', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_MIGRATE_URL: postgresql://agentos_migrate:${POSTGRES_MIGRATE_PASSWORD:?POSTGRES_MIGRATE_PASSWORD is required - run "pnpm setup:env"}@postgres:5432/${POSTGRES_DB:-agentos}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
      db-roles: { condition: service_healthy }

  api:
    <<: *app
    image: agentos-api:${AGENTOS_IMAGE_TAG:-local}
    build: { <<: *build, target: api }
    environment:
      <<: *node-env
      # Only the API and the migration process get PostgreSQL credentials; the worker has no database access by design (ADR-0006).
      # The API connects as its own non-superuser role (agentos_api), which owns nothing: the schema owner is agentos_migrate.
      DATABASE_URL: postgresql://agentos_api:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required - run "pnpm setup:env"}@postgres:5432/${POSTGRES_DB:-agentos}?schema=public
      API_HOST: 0.0.0.0 # reachable from other containers; the HOST port below is still bound to 127.0.0.1
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Authentication (ADR-0010). The browser reaches the app through the published web port; the web container's nginx is the one
      # reverse proxy in front of the API (it sets X-Forwarded-For to the real client address).
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      TRUST_PROXY_HOPS: 1
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-1440}
      SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-336}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # READINESS, not just liveness: unhealthy while PostgreSQL or Redis is unreachable (same semantics as /health/ready).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s

  worker:
    <<: *app
    image: agentos-worker:${AGENTOS_IMAGE_TAG:-local}
    build: { <<: *build, target: worker }
    environment:
      <<: *node-env
      QUEUE_PREFIX: ${QUEUE_PREFIX:-agentos}
      WORKER_NAME: ${WORKER_NAME:-worker}
      WORKER_QUEUES: ${WORKER_QUEUES:-system}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-60000}
      WORKER_ABORT_GRACE_MS: ${WORKER_ABORT_GRACE_MS:-10000}
      WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
      WORKER_STARTUP_TIMEOUT_MS: ${WORKER_STARTUP_TIMEOUT_MS:-30000}
      WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-30000}
      WORKER_HEALTH_FILE: /tmp/worker-health.json
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      # The worker has no HTTP port. This reads the heartbeat file the process maintains: healthy only if the process is
      # alive, the heartbeat is fresh (< 15 s old) and the worker says it is ready (not starting, draining or cut off from Redis).
      test: ['CMD', 'node', '/app/apps/worker/dist/healthcheck.js']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    # MUST exceed WORKER_SHUTDOWN_GRACE_MS (default 30 s): otherwise Docker kills the worker before it finished draining and
    # the shutdown is no longer graceful. tools/check-env.mjs enforces the relation for the defaults.
    stop_grace_period: 40s

  web:
    <<: *app
    image: agentos-web:${AGENTOS_IMAGE_TAG:-local}
    build: { <<: *build, target: web }
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  agentos-net:
    # Fixed name by default (existing setups keep their network). System tests override it so a throwaway stack can never
    # share DNS names ("redis", "postgres") with a developer's stack.
    name: ${AGENTOS_NETWORK:-agentos-net}

volumes:
  postgres-data:
  redis-data:
