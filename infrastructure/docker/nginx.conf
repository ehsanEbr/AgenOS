# Web container: serves the built single-page app and forwards /api to the API container.
# Mirrors `vite dev` (same origin, /api proxied), so the browser code is identical in both modes.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. With a variable in proxy_pass nginx resolves the name per request, so the API container can be
  # restarted (new IP) without breaking the proxy. A fixed hostname would be resolved once at startup and go stale.
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;   # no URI part: the original /api/... path is forwarded unchanged
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # Hashed build assets can be cached forever; index.html must always be revalidated so a new build is picked up.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;   # client-side routing
  }
}
