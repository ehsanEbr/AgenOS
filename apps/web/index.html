<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applies the saved theme, language and direction BEFORE first paint, so a dark-theme or Persian user never sees a
      // flash of the light/LTR page while JavaScript loads. React's ThemeProvider takes over afterwards.
      // Keep in sync with app/state/ui-preferences.store.ts (storage key) and shared/theme (layout colors);
      // src/app/providers/index-html.spec.ts fails if they drift apart.
      (function () {
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('agentos.ui-preferences') || '{}').state || {};
        } catch (e) {
          /* storage unavailable or corrupt: fall back to the system preference below */
        }
        try {
          var root = document.documentElement;
          var dark =
            saved.themeMode === 'dark' ||
            (saved.themeMode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.setProperty('--app-bg', dark ? '#000000' : '#f5f5f5');
          if (saved.locale === 'fa') {
            root.lang = 'fa';
            root.dir = 'rtl';
          }
        } catch (e) {
          /* the defaults apply */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
