packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only what the build needs.
allowBuilds:
  '@prisma/client': true # generates/locates the Prisma Client
  '@prisma/engines': true # downloads the Prisma query/schema engines
  prisma: true
  '@swc/core': true # Vitest decorator-metadata transform for the NestJS API tests
  esbuild: true # tsup and Vite
  nx: true
  '@scarf/scarf': false # telemetry only
  msgpackr-extract: false # optional native speedup for BullMQ; it falls back to pure JS

# Keep a single TypeScript version across the workspace. Without this, @nestjs/cli and tsup resolve their own
# TypeScript 5.9.x for `nest build` / d.ts generation while typecheck uses 5.8.x.
overrides:
  typescript: ~5.8.3
